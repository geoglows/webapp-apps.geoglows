<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GEOGLOWS | Global Water Intelligence</title>
  <meta name="description" content="Access open water intelligence tools for river forecasting, groundwater monitoring, and water sustainability research."/>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)"/>

  <!-- Open Graph -->
  <meta property="og:title" content="GEOGLOWS | Global Water Intelligence"/>
  <meta property="og:description" content="Open-access tools for river forecasting, groundwater monitoring, and water sustainability research."/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/geoglows-logo.png"/>

  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/src/style.css"/>

  <script>
    // Blocking, before first paint, so the page never flashes the wrong theme.
    try {
      const stored = localStorage.getItem('theme');
      if (stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { /* private mode */
    }

    // Supabase JS's detectSessionInUrl consumes the recovery hash during its
    // own init, so src/session.js reads this snapshot, not window.location.
    window.__GEOGLOWS_INITIAL_URL__ = {
      hash: window.location.hash,
      search: window.location.search,
    };
  </script>
</head>
<body>
<div class="min-h-screen text-slate-800 dark:text-slate-200 water-mesh flex flex-col">

  <nav class="w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-200 dark:border-white/5 py-8 md:py-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col items-center text-center relative">
      <div class="w-full flex justify-end mb-4 md:mb-0 md:absolute md:right-6 md:top-0">
        <div class="flex items-center gap-3">
          <div id="authActionSlot"></div>
          <button id="theme-toggle" aria-label="Toggle theme"
                  class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-400 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="dark:hidden">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden dark:block">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/>
              <path d="M12 20v2"/>
              <path d="m4.93 4.93 1.41 1.41"/>
              <path d="m17.66 17.66 1.41 1.41"/>
              <path d="M2 12h2"/>
              <path d="M20 12h2"/>
              <path d="m6.34 17.66-1.41 1.41"/>
              <path d="m19.07 4.93-1.41 1.41"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- The two logo files carry different amounts of transparent padding, so
           they are sized by width inside a fixed-height, clipped box. That puts
           both wordmarks at the same size and baseline across themes. -->
      <div class="flex h-20 items-center justify-center overflow-hidden mb-6">
        <img src="/geoglows-logo.png" alt="GEOGLOWS" class="w-72 max-w-full dark:hidden"/>
        <img src="/geoglows-logo-white.png" alt="GEOGLOWS" class="w-72 max-w-full hidden dark:block"/>
      </div>

      <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-tight mb-4 leading-tight">
        <span class="gradient-text">Global Water Intelligence</span>
      </h1>

      <p class="text-lg md:text-xl text-slate-600 dark:text-slate-400 max-w-3xl mx-auto font-medium leading-relaxed">
        Empowering individuals and organizations to solve local water challenges with global water intelligence.
      </p>
    </div>
  </nav>

  <!-- The app library is generated at runtime from apps.json by
       src/appLibrary.js. Edit that config to add/remove/regroup apps or change
       how many "coming soon" placeholders each group shows. -->
  <main id="appLibrary" class="max-w-7xl mx-auto px-6 py-10 grow w-full"></main>

  <footer class="mt-20 border-t border-slate-200 dark:border-slate-800 py-16 px-4 bg-white/50 dark:bg-transparent">
    <div class="max-w-6xl mx-auto text-center">
      <div class="border-slate-200 dark:border-slate-900 text-slate-500 dark:text-slate-300 text-xs">
        <p>
          &copy; 2026 GEOGLOWS
          <span aria-hidden="true" class="mx-2">&middot;</span>
          <a href="/terms.html" class="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">Terms &amp; Conditions</a>
        </p>
      </div>
    </div>
  </footer>

</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
